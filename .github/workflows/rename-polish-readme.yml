name: Finalize Polish README rename
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-polish-readme.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          sed -i 's/README\.pl\.md/README.PL.md/g' README.md README.DE.md README.PL.md
          rm -f README.pl.md
          rm -f .github/workflows/rename-polish-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename Polish README to README.PL.md"
          git push origin main
